<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — {{ programa }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { margin: 0; background: #0a2a5a; }
  #visor { width: 100vw; height: calc(100vh - 120px); display: flex; justify-content: center; align-items: center; background: #0a2a5a; }
  #pdfContainer { width: 95vw; height: 90vh; border: 3px solid var(--dorado); background: white; display: flex; justify-content: center; align-items: center; overflow: auto; }
  canvas { max-width: 100%; max-height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<header class="encabezado">
  <div class="barra-sesion">
    <span>{{ correo_sesion }} · {{ rol_sesion }}</span>
    <a class="boton-descarga" href="{{ url_pdf }}" target="_blank" rel="noopener">Descargar PDF</a>
    <a class="boton-volver" href="{{ url_for('index') }}">← Volver</a>
    <a href="{{ url_for('salir') }}">Salir</a>
  </div>
  <h1>Academia Horizonte</h1>
  <p>{{ programa }} — Cohorte {{ cohorte }}</p>
</header>

<div id="visor">
  <div id="pdfContainer">
    <p style="color:#666">Cargando certificado…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const url = "{{ url_pdf }}";
  const loadingTask = pdfjsLib.getDocument(url);
  loadingTask.promise.then(pdf => {
    return pdf.getPage(1);
  }).then(page => {
    const container = document.getElementById('pdfContainer');
    const viewport1 = page.getViewport({ scale: 1 });

    const render = () => {
      const rect = container.getBoundingClientRect();
      const disponibleW = rect.width - 40;
      const disponibleH = rect.height - 40;
      const scale = Math.min(disponibleW / viewport1.width, disponibleH / viewport1.height, 1);
      const scaledViewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      canvas.height = scaledViewport.height;
      canvas.width = scaledViewport.width;
      const ctx = canvas.getContext('2d');

      container.innerHTML = '';
      container.appendChild(canvas);

      page.render({ canvasContext: ctx, viewport: scaledViewport });
    };

    render();
    window.addEventListener('resize', render);
  }).catch(err => {
    document.getElementById('pdfContainer').innerHTML = '<p style="color:#c62828; padding:20px; text-align:center;">No se pudo cargar el certificado.</p>';
    console.error(err);
  });
</script>
</body>
</html>
